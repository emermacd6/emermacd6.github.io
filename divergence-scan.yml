name: 背离扫描 Divergence Scan

on:
  workflow_dispatch: {}   # 允许你在 GitHub 网页上手动点一下"Run workflow"来测试
  schedule:
    # 全部是 UTC 时间。大马时间 = UTC+8，所以下面这些时间对应大马时间
    # 14:30 到 23:10（伦敦开市前 -> 纽约盘中），每次间隔约 40 分钟，
    # 一天大约 14 轮 x 56 次请求 = 784 次，留一点余量给 Twelve Data 免费版
    # 每天 800 次的额度。
    - cron: '30 6 * * *'   # 14:30 MYT
    - cron: '10 7 * * *'   # 15:10 MYT
    - cron: '50 7 * * *'   # 15:50 MYT
    - cron: '30 8 * * *'   # 16:30 MYT
    - cron: '10 9 * * *'   # 17:10 MYT
    - cron: '50 9 * * *'   # 17:50 MYT
    - cron: '30 10 * * *'  # 18:30 MYT
    - cron: '10 11 * * *'  # 19:10 MYT
    - cron: '50 11 * * *'  # 19:50 MYT
    - cron: '30 12 * * *'  # 20:30 MYT
    - cron: '10 13 * * *'  # 21:10 MYT
    - cron: '50 13 * * *'  # 21:50 MYT
    - cron: '30 14 * * *'  # 22:30 MYT
    - cron: '10 15 * * *'  # 23:10 MYT

permissions:
  contents: write   # 需要写权限，才能把 data/divergence-state.json 提交回仓库

concurrency:
  group: divergence-scan
  cancel-in-progress: false   # 万一上一轮还没跑完（拉数据比较慢），不要中途打断它

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 一轮大约 7-8 分钟，给够余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行背离扫描
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/divergence-scan.mjs

      - name: 保存信号状态（避免重复提醒）
        run: |
          git config user.name "divergence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/divergence-state.json
          git diff --cached --quiet || git commit -m "更新背离信号状态 [skip ci]"
          git push
